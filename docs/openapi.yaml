openapi: 3.1.0
info:
  title: Hotel Bookings API
  version: 0.2.0
  description: REST API for the hotel-booking coding exercise.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Check service health
      operationId: healthz
      responses:
        '200':
          description: The process can accept HTTP requests.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /api/v1/hotels:
    get:
      summary: Find hotels by name
      operationId: searchHotels
      parameters:
        - name: name
          in: query
          required: true
          description: Case-insensitive substring to match against a hotel name.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Matching hotels, or an empty array when none match.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Hotel'
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /api/v1/test/reset:
    post:
      summary: Remove all evaluator test data
      description: Enabled only when ENABLE_TEST_ENDPOINTS is true. Do not expose on untrusted deployments.
      operationId: resetTestData
      responses:
        '204':
          description: All hotel, room, and booking data was removed.
        '404':
          description: Test endpoints are disabled.
  /api/v1/test/seed:
    post:
      summary: Create deterministic evaluator test data
      description: Enabled only when ENABLE_TEST_ENDPOINTS is true. Idempotently creates The Grand Hotel and its six rooms.
      operationId: seedTestData
      responses:
        '204':
          description: The deterministic test inventory exists.
        '404':
          description: Test endpoints are disabled.
components:
  schemas:
    Hotel:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: The Grand Hotel
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: invalid_request
            message:
              type: string
              example: name query parameter is required
  responses:
    InvalidRequest:
      description: The request is syntactically valid HTTP but violates API input requirements.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
